name: Deploy asset canister
description: Build and deploy one of the repo's asset canisters to the IC with icp-cli.

inputs:
  canister:
    description: Canister name, as declared in icp.yaml and keyed in canister_ids.json.
    required: true
  domain:
    description: >-
      Custom domain the canister serves. Asserted against its
      .well-known/ic-domains after the deploy.
    required: true
  identity-pem:
    description: PEM-encoded identity that controls the canister.
    required: true
  build-deps-dir:
    description: >-
      Directory to run `npm ci` in before deploying. The canister's build step
      in icp.yaml runs an npm script, which needs that directory's node_modules.
    required: true
  icp-version:
    description: icp-cli version to install. Keep in step with the pin in ci.yml.
    required: false
    default: "1.2.0"

runs:
  using: composite
  steps:
    - name: Install icp-cli
      shell: bash
      run: npm install -g @icp-sdk/icp-cli@${{ inputs.icp-version }}

    - name: Install ${{ inputs.canister }} build dependencies
      shell: bash
      working-directory: ${{ inputs.build-deps-dir }}
      run: npm ci

    # `icp identity import` has no --force and errors on an existing name, and
    # a release deploys more than one canister through this action, so the
    # second call would fail on an already-imported identity. Probe first.
    - name: Import mops identity
      shell: bash
      env:
        MOPS_IDENTITY_PEM: ${{ inputs.identity-pem }}
      run: |
        set -euo pipefail
        if icp identity principal --identity mops > /dev/null 2>&1; then
          echo "Identity 'mops' is already imported."
          exit 0
        fi
        umask 077
        trap 'rm -f "$RUNNER_TEMP/mops.pem"' EXIT
        printf '%s\n' "$MOPS_IDENTITY_PEM" > "$RUNNER_TEMP/mops.pem"
        icp identity import mops --from-pem "$RUNNER_TEMP/mops.pem" --storage plaintext

    # icp-cli keeps canister IDs in an untracked store, so the ID has to be
    # linked on every run. canister_ids.json stays the single source of truth.
    # A bare --force fails when no mapping exists yet, which is every fresh
    # checkout, so link plainly first and fall back for reruns.
    - name: Link the ${{ inputs.canister }} canister ID
      shell: bash
      env:
        CANISTER: ${{ inputs.canister }}
      run: |
        set -euo pipefail
        ID=$(jq --arg name "$CANISTER" -er '.[$name].ic' canister_ids.json)
        icp canister link "$CANISTER" "$ID" --environment ic \
          || icp canister link "$CANISTER" "$ID" --environment ic --force

    - name: Deploy ${{ inputs.canister }} canister
      shell: bash
      env:
        CANISTER: ${{ inputs.canister }}
      run: |
        set -euo pipefail
        for i in 1 2 3; do
          icp deploy "$CANISTER" --environment ic --identity mops --no-create --yes && exit 0
          echo "::warning::${CANISTER} canister deploy attempt $i/3 failed"
          if [ "$i" -lt 3 ]; then sleep 30; fi
        done
        exit 1

    # The custom domain resolves only while the canister serves this file, and
    # it is served only because an .ic-assets.json opts dot-directories into the
    # upload. Assert the body, not the status: the asset canister answers
    # unknown paths with the root index.html at HTTP 200.
    - name: Verify the custom domain still resolves
      shell: bash
      env:
        CANISTER: ${{ inputs.canister }}
        DOMAIN: ${{ inputs.domain }}
      run: |
        set -euo pipefail
        url="https://${DOMAIN}/.well-known/ic-domains"
        for attempt in 1 2 3; do
          if curl -sS --max-time 30 "$url" 2>/dev/null | grep -qxF "$DOMAIN"; then
            echo "ok    $url"
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then sleep 10; fi
        done
        ID=$(jq --arg name "$CANISTER" -er '.[$name].ic' canister_ids.json)
        echo "::error::$url does not list ${DOMAIN}. The custom domain is broken."
        echo "::error::Roll back from a checkout of the previous release commit with:"
        echo "::error::  icp canister link ${CANISTER} ${ID} -e ic --force"
        echo "::error::  icp deploy ${CANISTER} -e ic --identity mops --no-create --yes"
        exit 1
