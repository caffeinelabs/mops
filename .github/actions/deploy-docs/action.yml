name: Deploy docs canister
description: Build and deploy the docs asset canister to the IC with icp-cli.

inputs:
  identity-pem:
    description: PEM-encoded identity that controls the docs canister.
    required: true
  icp-version:
    description: icp-cli version to install. Keep in step with the pin in ci.yml.
    required: false
    default: "1.2.0"

runs:
  using: composite
  steps:
    - name: Install icp-cli
      shell: bash
      run: npm install -g @icp-sdk/icp-cli@${{ inputs.icp-version }}

    # The docs recipe in icp.yaml builds with `npm run build-docs`, which needs
    # docs/node_modules.
    - name: Install docs dependencies
      shell: bash
      working-directory: docs
      run: npm ci

    - name: Import mops identity
      shell: bash
      env:
        MOPS_IDENTITY_PEM: ${{ inputs.identity-pem }}
      run: |
        set -euo pipefail
        umask 077
        trap 'rm -f "$RUNNER_TEMP/mops.pem"' EXIT
        printf '%s\n' "$MOPS_IDENTITY_PEM" > "$RUNNER_TEMP/mops.pem"
        icp identity import mops --from-pem "$RUNNER_TEMP/mops.pem" --storage plaintext

    # icp-cli keeps canister IDs in an untracked store, so the ID has to be
    # linked on every run. canister_ids.json stays the single source of truth.
    # A bare --force fails when no mapping exists yet, which is every fresh
    # checkout, so link plainly first and fall back for reruns.
    - name: Link the docs canister ID
      shell: bash
      run: |
        set -euo pipefail
        DOCS_ID=$(jq -er '.docs.ic' canister_ids.json)
        icp canister link docs "$DOCS_ID" --environment ic \
          || icp canister link docs "$DOCS_ID" --environment ic --force

    - name: Deploy docs canister
      shell: bash
      run: |
        set -euo pipefail
        for i in 1 2 3; do
          icp deploy docs --environment ic --identity mops --no-create --yes && exit 0
          echo "::warning::Docs canister deploy attempt $i/3 failed"
          [ "$i" -lt 3 ] && sleep 30
        done
        exit 1

    # docs.mops.one resolves only while the canister serves this file, and it is
    # served only because docs/static/.ic-assets.json opts dot-directories into
    # the upload. Assert the body, not the status: the asset canister answers
    # unknown paths with the root index.html at HTTP 200.
    - name: Verify the custom domain still resolves
      shell: bash
      run: |
        set -euo pipefail
        url=https://docs.mops.one/.well-known/ic-domains
        for attempt in 1 2 3; do
          if curl -sS --max-time 30 "$url" 2>/dev/null | grep -qxF 'docs.mops.one'; then
            echo "ok    $url"
            exit 0
          fi
          [ "$attempt" -lt 3 ] && sleep 10
        done
        echo "::error::$url does not list docs.mops.one. The custom domain is broken."
        echo "::error::Roll back with: dfx deploy --network ic --no-wallet docs --identity mops"
        exit 1
