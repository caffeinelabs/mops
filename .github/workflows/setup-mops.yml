name: mops test with dfinity/setup-mops

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test with dfinity/setup-mops

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # No mops-version: the action defaults to `latest`, which is how a user
      # would wire it up, and it is the version worth knowing still works here.
      # The 1.0.0 that used to be pinned dated from 2024 and was the last thing
      # in this repo that needed a dfx replica.
      - uses: dfinity/setup-mops@3e94e453352269b34137b5ce49f09a8df81bed7d # v1.4.1
      - name: Run tests
        run: mops test
