name: AI PR Review

# Thin wrapper around the shared reusable workflow in caffeinelabs/devtools.
# Review logic (Cursor run, verdict parsing, updatable comment, GitHub approval
# on APPROVE + stale-approval dismissal otherwise) is maintained once in
# devtools; this repo keeps its own prompt at .github/prompts/pr-review-prompt.md
# (the reusable workflow's default prompt_path), read from the PR base ref so
# PR-side prompt rewrites are reviewed as untrusted code.
# The approval counts toward a required-review branch protection rule because
# it is submitted with the SA_RW_GITHUB_TOKEN service-account PAT (the default
# GITHUB_TOKEN's reviews do not count).
# Fork PRs are skipped inside the reusable workflow, so secrets never reach
# external contributors. To skip AI review on a PR, add the 'skip-ai-review'
# label.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

# One review at a time per PR: a new commit cancels the in-progress review of
# the superseded commit, so rapid pushes don't stack overlapping paid runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    uses: caffeinelabs/devtools/.github/workflows/reusable-ai-pr-review.yml@main
    with:
      # Pinned frontier model; the account default ("Auto") routes to cheaper
      # models that produce shallow reviews.
      model: grok-4.5
      prompt_path: .github/prompts/pr-review-prompt.md
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      GH_REVIEW_TOKEN: ${{ secrets.SA_RW_GITHUB_TOKEN }}
