name: AI PR review

# Posts a Cursor AI review as a single updatable PR comment with a verdict
# header (APPROVE / REQUEST_CHANGES / REQUEST_HUMAN_REVIEW / REVIEW_ERROR).
# An APPROVE verdict also submits an approving review with the
# SA_RW_GITHUB_TOKEN service-account PAT — the default GITHUB_TOKEN's reviews
# do not count toward branch protection — so a required-approval rule can be
# satisfied by either a human or this workflow; any other verdict dismisses
# still-active automated approvals from previous runs. CHANGES_REQUESTED
# reviews are never submitted — REQUEST_CHANGES fails the job (red X) instead,
# so a human approval can override a false positive without dismissing a bot
# review. When SA_RW_GITHUB_TOKEN is not configured, the review degrades to
# comment-only.
#
# The review runs as two waves in .github/scripts/ai-review/run-review.sh:
# parallel find sweeps, then one judging pass that refutes, classifies and
# writes the verdict. A single pass that both hunts for defects and decides
# whether to approve suppresses its own findings, so the sweeps never see the
# verdict rules. Four agent calls on a code PR, two on a prose-only one.
#
# The prompts, the pipeline scripts and this workflow are all read from the PR
# head, so a PR that changes them is reviewed BY them — prompt work is testable
# on its own PR. The flip side: with branch protection this makes the review
# self-referential, so the approval gate is a safeguard against mistakes by
# trusted contributors, not against a malicious writer (who could weaken the
# prompt, the scripts and the review in the same PR).
#
# Skips draft, forked, and dependabot PRs, and PRs labeled `skip-ai-review`,
# so CURSOR_API_TOKEN is never exposed to external contributors.
# Skips cleanly (green) when CURSOR_API_TOKEN is not configured.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.fork == false &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-ai-review') &&
      (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'skip-ai-review'
      )
    runs-on: ubuntu-latest
    # Three parallel sweeps plus one judge. The generous timeout is a backstop
    # for a stuck agent, not the expected duration — this check is meant to
    # finish alongside the other CI jobs, not after them.
    timeout-minutes: 20
    concurrency:
      group: ai-pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      # Tried in order. The account default ("Auto") routes to cheaper models
      # that produce shallow reviews, so the chain is pinned. The Fast tier
      # leads because it is the same model with faster output; the plain and
      # previous pins follow, since an unrecognised slug would otherwise lose
      # the whole run.
      REVIEW_MODELS: grok-4.6-fast grok-4.6 grok-4.5
      CONTEXT_DIR: .ai-review-context
      WORK_DIR: .ai-review-work
      PROMPT_DIR: .github/prompts
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check API token
        id: token
        env:
          CURSOR_API_TOKEN: ${{ secrets.CURSOR_API_TOKEN }}
          SA_RW_GITHUB_TOKEN: ${{ secrets.SA_RW_GITHUB_TOKEN }}
        run: |
          if [ -z "${CURSOR_API_TOKEN:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "CURSOR_API_TOKEN not configured; skipping AI review."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "${SA_RW_GITHUB_TOKEN:-}" ]; then
            echo "approval=false" >> "$GITHUB_OUTPUT"
            echo "SA_RW_GITHUB_TOKEN not configured; review is comment-only (no GitHub approval)."
          else
            echo "approval=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize verdict
        if: steps.token.outputs.configured == 'true'
        run: echo "AI_REVIEW_VERDICT=UNKNOWN" >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.token.outputs.configured == 'true'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Materialize PR review context
        if: steps.token.outputs.configured == 'true'
        env:
          # The review agents run with Shell(*) and Read(.git/**) denied, so git
          # history and prior human review comments are materialized here, where
          # the job still has a checkout and a token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/ai-review/materialize-context.sh

      - name: Install Cursor CLI
        id: install-cursor
        if: steps.token.outputs.configured == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail

          export PATH="$HOME/.local/bin:$HOME/.cursor/bin:$PATH"

          if command -v cursor-agent >/dev/null 2>&1 || command -v agent >/dev/null 2>&1; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
            exit 0
          fi

          INSTALLER=$(mktemp)
          trap 'rm -f "$INSTALLER"' EXIT
          curl --retry 3 --retry-all-errors --retry-delay 2 -fsSL https://cursor.com/install -o "$INSTALLER"

          if ! head -1 "$INSTALLER" | grep -q '^#!.*bash'; then
            echo "ERROR: downloaded installer is not a bash script"
            exit 1
          fi

          bash "$INSTALLER"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.cursor/bin:$PATH"

          if ! command -v cursor-agent >/dev/null 2>&1 && ! command -v agent >/dev/null 2>&1; then
            echo "ERROR: Cursor CLI was not installed"
            exit 1
          fi

      - name: Run AI review
        id: ai-review
        if: steps.token.outputs.configured == 'true' && steps.install-cursor.outcome == 'success'
        continue-on-error: true
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_TOKEN }}
          OUTPUT_FILE: cursor-ai-review.md
        run: .github/scripts/ai-review/run-review.sh

      - name: Parse verdict
        id: verdict
        if: always() && steps.token.outputs.configured == 'true'
        run: |
          set -euo pipefail

          if [ ! -s cursor-ai-review.md ]; then
            echo "AI_REVIEW_VERDICT=REVIEW_ERROR" >> "$GITHUB_ENV"
            exit 0
          fi

          # Probable bug findings (any P#) force REQUEST_CHANGES regardless of
          # whatever Decision token the model emitted.
          HAS_P=false
          if grep -Eq '^[[:space:]]*-?[[:space:]]*P[0-3]:' cursor-ai-review.md; then
            HAS_P=true
          fi

          # Significant intended-change findings (S0/S1/S2) force REQUEST_HUMAN_REVIEW
          # when there are no P# findings. S3 is non-blocking (the prompt asks the
          # model not to emit it, but if one slips through we ignore it for gating).
          HAS_S=false
          if grep -Eq '^[[:space:]]*-?[[:space:]]*S[0-2]:' cursor-ai-review.md; then
            HAS_S=true
          fi

          # Extract the model's stated Decision token for tie-breaking only.
          DECISION_TOKEN="$(
            grep -E '^(\*\*Decision\*\*|Decision):' cursor-ai-review.md \
              | sed -E 's/^(\*\*Decision\*\*|Decision):[[:space:]]*//' \
              | tr -d '\r' \
              | xargs \
              | tail -n 1 || true
          )"

          if [ "$HAS_P" = "true" ]; then
            VERDICT=REQUEST_CHANGES
          elif [ "$HAS_S" = "true" ]; then
            VERDICT=REQUEST_HUMAN_REVIEW
          else
            case "$DECISION_TOKEN" in
              APPROVE)               VERDICT=APPROVE ;;
              REQUEST_CHANGES)       VERDICT=REQUEST_CHANGES ;;
              REQUEST_HUMAN_REVIEW)  VERDICT=REQUEST_HUMAN_REVIEW ;;
              REVIEW_ERROR)          VERDICT=REVIEW_ERROR ;;
              *)                     VERDICT=REVIEW_ERROR ;;
            esac
          fi

          echo "AI_REVIEW_VERDICT=${VERDICT}" >> "$GITHUB_ENV"
          echo "Parsed verdict: ${VERDICT} (Decision token: '${DECISION_TOKEN}')"

      - name: Ensure review comment body
        # Always runs (when the token is configured) so the post step has
        # something to publish. `continue-on-error: true` on install/review
        # masks step failure into job success, so we cannot key off
        # job.status — instead, treat any missing/empty file as a failure
        # and write the fallback notice. This also covers checkout and
        # materialize failures (which skip later steps without
        # continue-on-error).
        if: always() && steps.token.outputs.configured == 'true'
        run: |
          if [ ! -s cursor-ai-review.md ]; then
            cat > cursor-ai-review.md <<'EOF'
          ⚠️ **AI review could not be completed.**

          Please proceed with manual code review. Common causes: checkout/diff failure, install failure, Cursor API issues, or rate limiting.
          EOF
          fi

      - name: Upload review artifacts
        # Every pass's prompt, raw findings and verdicts. Without this the only
        # record is the PR comment, which the next run overwrites — so a missed
        # bug cannot be diagnosed after the fact, and prompt changes cannot be
        # measured against past runs.
        if: always() && steps.token.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: ai-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            cursor-ai-review.md
            .ai-review-work/
            .ai-review-context/diff-stat.txt
            .ai-review-context/changed-files.txt
            .ai-review-context/history/
          # Every path here starts with a dot, and upload-artifact drops hidden
          # files by default — without this the artifact arrives empty and a
          # failed run cannot be diagnosed, which is the whole point of it.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Post AI review comment
        if: always() && steps.token.outputs.configured == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AI_REVIEW_VERDICT: ${{ env.AI_REVIEW_VERDICT }}
        with:
          script: |
            const fs = require("fs");

            const {owner, repo} = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = "<!-- cursor-ai-review -->";
            const historyMarker = "<!-- cursor-ai-review-history -->";
            const maxBodyLength = 60000;
            const maxHistoryEntries = 10;
            const headSha = context.payload.pull_request.head.sha;
            const verdict = process.env.AI_REVIEW_VERDICT || "REVIEW_ERROR";

            // A transient GitHub 5xx used to turn a clean review into a red X.
            const retry = async (label, fn) => {
              let lastError;
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  lastError = error;
                  const status = error.status || 0;
                  if (!(status === 0 || status === 429 || status >= 500) || attempt === 3) {
                    break;
                  }
                  core.warning(`${label} failed (attempt ${attempt}, status ${status}): ${error.message}; retrying`);
                  await new Promise((resolve) => setTimeout(resolve, 2000 * attempt));
                }
              }
              throw lastError;
            };

            const verdictHeader = {
              APPROVE:              "**👍 APPROVE** — looks safe to merge",
              REQUEST_HUMAN_REVIEW: "**👀 HUMAN REVIEW REQUESTED** — significant intended changes detected",
              REQUEST_CHANGES:      "**👎 REQUEST_CHANGES** — probable bug(s) found",
              REVIEW_ERROR:         "**❓ REVIEW_ERROR** — review could not be completed",
            }[verdict] || "**❓ REVIEW_ERROR** — review could not be completed";

            let review = "";
            try {
              review = fs.readFileSync("cursor-ai-review.md", "utf8").trim();
            } catch (_) {}
            if (!review) {
              review = "⚠️ **AI review could not be completed.**\n\nPlease proceed with manual code review.";
            }

            const reviewLines = review.split("\n").length;
            if (reviewLines > 150) {
              review = `<details>\n<summary>View full review (${reviewLines} lines)</summary>\n\n${review}\n\n</details>`;
            }

            // Pipeline stats come from the run, not from the model's own account
            // of what it did.
            const stats = {};
            try {
              for (const line of fs.readFileSync(".ai-review-work/review-stats.txt", "utf8").split("\n")) {
                const [key, ...rest] = line.split("=");
                if (key && rest.length) stats[key.trim()] = rest.join("=").trim();
              }
            } catch (_) {}
            const statsParts = [`Generated for commit ${headSha}`];
            if (stats.sweeps) statsParts.push(`${stats.sweeps} sweeps`);
            if (stats.agent_calls) statsParts.push(`${stats.agent_calls} agent calls`);
            if (stats.candidates) statsParts.push(`${stats.candidates} candidates`);
            if (stats.confirmed) statsParts.push(`${stats.confirmed} confirmed`);
            if (stats.plausible && stats.plausible !== "0") statsParts.push(`${stats.plausible} plausible`);
            if (stats.refuted && stats.refuted !== "0") statsParts.push(`${stats.refuted} refuted`);
            if (stats.models) statsParts.push(stats.models);
            if (stats.seconds) statsParts.push(`${stats.seconds}s`);

            const comments = await retry("listComments", () => github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            }));
            const existing = comments.filter((comment) => (comment.body || "").includes(marker));
            const previous = existing.length > 0 ? existing[existing.length - 1] : null;

            // Carry the verdict of every earlier run forward, newest first, so a
            // later run cannot erase the record of what an earlier one said.
            const shortSha = headSha.slice(0, 8);
            const previousBody = (previous && previous.body) || "";
            const historyStart = previousBody.indexOf(historyMarker);
            const priorEntries = (historyStart === -1
              ? []
              : previousBody.slice(historyStart + historyMarker.length).split("\n"))
              .filter((line) => /^- `[0-9a-f]{7,40}` — /.test(line.trim()))
              .filter((line) => !line.includes(shortSha));
            const historyEntries = [
              `- \`${shortSha}\` — ${verdict} — ${new Date().toISOString()}`,
              ...priorEntries,
            ].slice(0, maxHistoryEntries);
            const history = [
              "<details>",
              "<summary>Review history</summary>",
              "",
              historyMarker,
              ...historyEntries,
              "",
              "</details>",
            ].join("\n");

            const heading = `### Cursor AI review\n\n${verdictHeader}`;
            const prefix = `${marker}\n${heading}\n\n`;
            const suffix = `\n\n${history}\n\n---\n_${statsParts.join(" · ")}_`;
            const truncationNotice = "\n\n_Review truncated because it exceeded GitHub's comment size limit._";

            if (prefix.length + review.length + suffix.length > maxBodyLength) {
              const room = maxBodyLength - prefix.length - suffix.length - truncationNotice.length;
              review = review.slice(0, Math.max(room, 0)) + truncationNotice;
            }
            const body = `${prefix}${review}${suffix}`;

            if (previous) {
              await retry("updateComment", () => github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              }));
            } else {
              await retry("createComment", () => github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              }));
            }

      - name: Submit or dismiss GitHub approval
        # Runs with the SA_RW_GITHUB_TOKEN service-account PAT because the
        # default GITHUB_TOKEN's reviews do not count toward branch protection.
        # APPROVE submits an approving review (skipped if this head SHA is
        # already approved); every other verdict — including UNKNOWN from an
        # early failure — dismisses still-active automated approvals so a
        # stale approval can't carry new commits over the required-review bar.
        # Approval failure is a warning (humans can still approve); dismissal
        # failure fails the job because leaving a stale approval standing is a
        # gating bug.
        if: always() && steps.token.outputs.configured == 'true' && steps.token.outputs.approval == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AI_REVIEW_VERDICT: ${{ env.AI_REVIEW_VERDICT }}
        with:
          github-token: ${{ secrets.SA_RW_GITHUB_TOKEN }}
          script: |
            const {owner, repo} = context.repo;
            const pull_number = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;
            const verdict = process.env.AI_REVIEW_VERDICT || "REVIEW_ERROR";
            const marker = "<!-- cursor-ai-review-approval -->";

            const retry = async (label, fn) => {
              let lastError;
              for (let attempt = 1; attempt <= 3; attempt++) {
                try {
                  return await fn();
                } catch (error) {
                  lastError = error;
                  const status = error.status || 0;
                  if (!(status === 0 || status === 429 || status >= 500) || attempt === 3) {
                    break;
                  }
                  core.warning(`${label} failed (attempt ${attempt}, status ${status}): ${error.message}; retrying`);
                  await new Promise((resolve) => setTimeout(resolve, 2000 * attempt));
                }
              }
              throw lastError;
            };

            const {data: reviewer} = await retry("getAuthenticated", () => github.rest.users.getAuthenticated());

            const reviews = await retry("listReviews", () => github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number,
            }));
            const botApprovals = reviews.filter((review) =>
              review.state === "APPROVED" &&
              (review.user || {}).login === reviewer.login &&
              (review.body || "").includes(marker)
            );

            if (verdict === "APPROVE") {
              if (botApprovals.some((review) => review.commit_id === headSha)) {
                core.info(`Commit ${headSha} already has an automated approval; skipping.`);
                return;
              }
              try {
                await retry("createReview", () => github.rest.pulls.createReview({
                  owner,
                  repo,
                  pull_number,
                  commit_id: headSha,
                  event: "APPROVE",
                  body: `${marker}\nAutomated approval: the AI review verdict for ${headSha} is APPROVE. See the "Cursor AI review" comment for details.`,
                }));
              } catch (error) {
                core.warning(`Could not submit automated approval: ${error.message}`);
              }
            } else {
              for (const review of botApprovals) {
                try {
                  await retry("dismissReview", () => github.rest.pulls.dismissReview({
                    owner,
                    repo,
                    pull_number,
                    review_id: review.id,
                    message: `AI review verdict for ${headSha} is ${verdict}; dismissing stale automated approval.`,
                  }));
                } catch (error) {
                  core.setFailed(`Could not dismiss stale automated approval ${review.id}: ${error.message}`);
                }
              }
            }

      - name: Fail job on REQUEST_CHANGES
        # Only REQUEST_CHANGES turns the check red. REQUEST_HUMAN_REVIEW and
        # REVIEW_ERROR stay green so AI/infra hiccups don't block merges; the
        # comment carries the signal in those cases.
        if: steps.token.outputs.configured == 'true' && env.AI_REVIEW_VERDICT == 'REQUEST_CHANGES'
        run: |
          echo "AI review verdict: REQUEST_CHANGES — failing job for visibility."
          exit 1
