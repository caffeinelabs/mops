name: mops test

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 45
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        mops-version:
          [./cli/dist, ic-mops, "https://cli.mops.one/versions/latest.tgz"]
        moc-version: [0.14.13]
        node-version: [22, 24, 26]
        runner: [ubuntu-latest]

    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.runner }}, node ${{ matrix.node-version }}, moc ${{ matrix.moc-version }}, ${{ matrix.mops-version }}

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      # Only the published 2.x entries need dfx, and only as a replica:
      # `test/storage-actor.test.mo` runs in replica mode, and 2.x falls back to
      # the dfx replica because mops.toml pins no `[toolchain] pocket-ic`. 3.x
      # dropped that fallback and downloads PocketIC itself, so the condition
      # doubles as a guard — if the current CLI regressed into needing dfx,
      # its matrix entry would fail here rather than pass on a borrowed binary.
      # dfx-version is pinned because there is no longer a dfx.json for
      # setup-dfx's `auto` to read; it would silently install the latest.
      - uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365 # main
        if: ${{ matrix.mops-version != './cli/dist' }}
        with:
          dfx-version: "0.29.1"
      - run: dfx cache install
        if: ${{ matrix.mops-version != './cli/dist' }}
      - name: Cache mops packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: mops-packages-${{ runner.os }}-${{ hashFiles('mops.toml') }}
          restore-keys: |
            mops-packages-${{ runner.os }}-${{ hashFiles('mops.toml') }}
            mops-packages-${{ runner.os }}
          path: |
            ~/.cache/mops
            ~/Library/Caches/mops

      - uses: ./.github/actions/cache-rust-wasm
        if: ${{ matrix.mops-version == './cli/dist' }}

      - name: Install and build local cli
        if: ${{ matrix.mops-version == './cli/dist' }}
        run: cd cli && npm ci

      - name: Install mops
        run: npm i -g ${{ matrix.mops-version }}

      - name: Install mops packages
        run: mops install

      - name: Print resolved mops packages
        run: mops sources

      - name: Select moc version
        run: mops toolchain use moc ${{ matrix.moc-version }}

      - name: Run tests
        run: mops test

  ci-ok-mops:
    timeout-minutes: 5
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
