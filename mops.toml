# Mirrors the motoko canisters in icp.yaml. The icp-cli motoko
# recipe builds via `mops build <name>`, which resolves the entry point here.
[canisters]
main = "backend/main/main-canister.mo"
bench = "cli/commands/bench/bench-canister.mo"

[dev-dependencies]
test = "2.1.1"
fuzz = "1.0.0"
bench = "1.0.0"
prng = "0.0.8"

[toolchain]
moc = "0.14.14"
pocket-ic = "15.0.0"
wasmtime = "34.0.1"
lintoko = "0.7.0"
