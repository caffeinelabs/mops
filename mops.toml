[dependencies]
base = "0.14.14"
time-consts = "1.0.1"
map = "9.0.1"
ic = "3.2.0"
backup = "3.0.0"
sha2 = "0.1.0"
vector = "0.4.0"
http-types = "1.0.1"
datetime = "1.0.0"
