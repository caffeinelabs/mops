[package]
name = "wasm"
version = "0.1.0"
authors = ["Ryan Vandersmith <ryan.vandersmith@dfinity.org>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
wasm-bindgen = { version = "0.2" }
serde-wasm-bindgen = "0.6"
candid = "0.10"
candid_parser = "0.2"
walrus = "0.24.4"
